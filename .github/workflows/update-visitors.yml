name: Update visitor map

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-visitors.yml
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: write

concurrency:
  group: update-visitor-map
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check GA4 configuration
        id: ga
        env:
          GA_CREDENTIALS: ${{ secrets.GA_CREDENTIALS }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
        run: |
          if [ -n "$GA_CREDENTIALS" ] && [ -n "$GA_PROPERTY_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Visitor update skipped until GA_CREDENTIALS and GA_PROPERTY_ID are configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.ga.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.ga.outputs.configured == 'true'
        run: npm ci

      - name: Query GA4
        if: steps.ga.outputs.configured == 'true'
        run: npm run update:visitors
        env:
          GA_CREDENTIALS: ${{ secrets.GA_CREDENTIALS }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_START_DATE: ${{ vars.GA_START_DATE || '2020-10-14' }}
          GA_END_DATE: today

      - name: Commit refreshed statistics
        if: steps.ga.outputs.configured == 'true'
        run: |
          if git diff --quiet -- public/visitor-stats.json; then
            echo "Visitor statistics are already current."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/visitor-stats.json
          git commit -m "Update visitor statistics"
          git push
